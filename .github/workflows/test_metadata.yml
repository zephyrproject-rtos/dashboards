name: Test Metadata Analysis

on:
  schedule:
    - cron: '0 6 * * *'  # Every day at 06:00 UTC
  workflow_dispatch:
    inputs:
      zephyr_ref:
        description: 'Zephyr branch, tag or SHA to analyse'
        required: false
        default: 'main'
      top:
        description: 'Rows per page in the report tables'
        required: false
        default: '50'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-metadata:
    runs-on: ubuntu-latest
    if: github.repository_owner == 'zephyrproject-rtos'

    steps:
      - name: Checkout Zephyr
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: zephyrproject-rtos/zephyr
          ref: ${{ inputs.zephyr_ref || 'main' }}
          path: zephyr
          fetch-depth: 1

      - name: Checkout Dashboard scripts
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: dashboards
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python3 -m pip install --user PyYAML awscli==1.45.11
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run test metadata analysis
        run: |
          python3 dashboards/scripts/test_metadata_report.py \
            --root "$GITHUB_WORKSPACE/zephyr" \
            --output "$GITHUB_WORKSPACE/test_metadata_report.html" \
            --json "$GITHUB_WORKSPACE/test_metadata_findings.json" \
            --top "${{ inputs.top || '50' }}"

      - name: Summarise findings
        if: always()
        run: |
          FINDINGS="$GITHUB_WORKSPACE/test_metadata_findings.json"
          [[ -f "${FINDINGS}" ]] || exit 0

          python3 - "${FINDINGS}" >> "${GITHUB_STEP_SUMMARY}" <<'EOF'
          import collections, json, sys

          data = json.load(open(sys.argv[1]))
          totals, rules = data["totals"], data["rules"]
          by_rule = collections.Counter(f["rule"] for f in data["findings"])
          by_sev = collections.Counter(f["severity"] for f in data["findings"])

          print("## Test metadata analysis\n")
          print(f"`{totals['descriptors']}` descriptors · "
                f"`{totals['applications']}` applications · "
                f"`{totals['scenarios']}` scenarios · "
                f"**{totals['findings']}** findings "
                f"({by_sev['high']} high, {by_sev['medium']} medium, "
                f"{by_sev['low']} low)\n")
          print("| Severity | Rule | Hits |")
          print("| --- | --- | ---: |")
          order = {"high": 0, "medium": 1, "low": 2}
          for rule, hits in sorted(by_rule.items(),
                                   key=lambda kv: (order[rules[kv[0]]["severity"]],
                                                   -kv[1])):
              print(f"| {rules[rule]['severity']} | `{rule}` "
                    f"— {rules[rule]['title']} | {hits} |")
          EOF

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-metadata-report
          path: |
            test_metadata_report.html
            test_metadata_findings.json
          if-no-files-found: ignore

      - name: Publish to AWS S3
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          AWS_ACCESS_KEY_ID: ${{ vars.AWS_TESTING_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_TESTING_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
        run: |
          PUBLISH_BUCKET="testing.zephyrproject.org"
          PUBLISH_DOMAIN="testing.zephyrproject.io"
          PUBLISH_ROOT="dashboards/test-metadata"

          aws s3 cp "$GITHUB_WORKSPACE/test_metadata_report.html" \
            "s3://${PUBLISH_BUCKET}/${PUBLISH_ROOT}/index.html"
          aws s3 cp "$GITHUB_WORKSPACE/test_metadata_findings.json" \
            "s3://${PUBLISH_BUCKET}/${PUBLISH_ROOT}/findings.json"
          echo "Report available at: https://${PUBLISH_DOMAIN}/${PUBLISH_ROOT}/index.html" \
            >> "${GITHUB_STEP_SUMMARY}"
